name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Минимальные права: workflow-токен умеет только читать код (least privilege).
permissions:
  contents: read

jobs:
  quality:
    name: Линт, типы, тесты и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - name: Забрать код
        # Пин по хешу коммита (v7.0.1): тег можно подменить, хеш — нет.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Установить Bun
        # Пин по хешу коммита (v2.2.0): защита supply chain.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14 # тот же, что локально и в lockfile — сборка воспроизводима

      - name: Установить зависимости
        run: bun install --frozen-lockfile

      # Самолечение CI (prisma/orm#27754): bun-экстрактор на свежем рантнере может
      # не положить wasm-base64-рантаймы @prisma/client. Диагноз фактом: если файлов
      # нет — досыпаем их из тарбола той же версии реестра. Версия пиннута = <шаг не
      # может подменить код; расхождение логируется строкой в лог.
      - name: Гарантия рантайм-файлов Prisma (самолечение orm#27754)
        run: |
          D=node_modules/@prisma/client/runtime
          V=$(node -p "require('./node_modules/@prisma/client/package.json').version")
          if [ -f "$D/query_engine_bg.sqlite.wasm-base64.js" ]; then
            echo "runtime-файлы на месте (client@$V) — самолечение не понадобилось"
          else
            echo "ОБНАРУЖЕН ДЕФЕКТ ЭКСТРАКЦИИ bun: досыпаем рантаймы из тарбола @prisma/client@$V"
            T=$(npm pack "@prisma/client@$V" --pack-destination /tmp | tail -1)
            rm -rf /tmp/pc-repair && mkdir -p /tmp/pc-repair
            tar -xzf "/tmp/$T" -C /tmp/pc-repair package/runtime
            cp /tmp/pc-repair/package/runtime/* "$D"/
            echo "досыпано файлов: $(ls "$D" | wc -l)"
          fi
          test -f "$D/query_engine_bg.sqlite.wasm-base64.js"

      - name: Сгенерировать Prisma Client
        run: bunx prisma generate

      - name: Линт
        run: bun run lint

      - name: Проверка типов
        run: bun run typecheck

      - name: Юнит-тесты
        run: bun run test

      - name: Подготовить базу для сборки
        run: bunx prisma db push --accept-data-loss --skip-generate

      - name: Сборка
        run: bun run build
